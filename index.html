<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conteo Vans Gyaa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --fondo:#0c0c0e; --panel:#151518; --panel2:#1c1c20; --linea:#2a2a30;
  --texto:#f4f4f5; --apagado:#9b9ba4; --rojo:#e02434; --ambar:#e8a13c;
  --ok:#3ecf6f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--fondo);color:var(--texto);font-family:"Barlow",-apple-system,sans-serif;
     font-size:17px;line-height:1.5;padding-bottom:126px}
h1,.van-btn,.sec-titulo{font-family:"Archivo","Barlow",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--fondo);border-bottom:1px solid var(--linea);
       padding:14px 14px 12px}
h1{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:2.5px}
h1 .rojo{color:var(--rojo)}
.sub{color:var(--apagado);font-size:14px;margin-top:2px}
.vans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.van-btn{padding:16px 8px;border-radius:10px;border:2px solid var(--linea);background:var(--panel);
  color:var(--apagado);font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;
  cursor:pointer;text-align:center;transition:.12s}
.van-btn small{display:block;font-family:"Barlow";font-weight:500;font-size:13px;letter-spacing:.4px;
  text-transform:none;margin-top:3px;color:inherit;opacity:.85}
.van-btn.activa-v1{border-color:var(--rojo);color:#fff;background:linear-gradient(180deg,#2a1013,#1a0c0e)}
.van-btn.activa-v2{border-color:var(--ambar);color:#fff;background:linear-gradient(180deg,#241a0c,#171106)}
.filtros{display:flex;gap:8px;margin-top:12px}
input[type=search],select{width:100%;padding:13px 12px;border-radius:9px;border:1px solid var(--linea);
  background:var(--panel);color:var(--texto);font-family:inherit;font-size:16px;appearance:none}
input[type=search]::placeholder{color:var(--apagado)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--rojo);outline-offset:1px}
select{max-width:46%}
main{padding:10px 14px}
.aviso{background:var(--panel);border:1px solid var(--linea);border-left:3px solid var(--ambar);
  border-radius:0 9px 9px 0;padding:10px 12px;font-size:13.5px;color:var(--apagado);margin:8px 0}
.sec-titulo{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:2px;
  color:var(--apagado);margin:16px 0 8px}
.fila{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--linea);
  border-radius:10px;padding:10px 12px;margin-bottom:8px}
.fila.contada{border-color:#2c4633;background:#121914}
.info{flex:1;min-width:0}
.nombre{font-weight:600;font-size:16px;line-height:1.25}
.detalle{color:var(--apagado);font-size:13.5px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:2px;flex-shrink:0}
.stepper button{width:48px;height:48px;border-radius:9px;border:1px solid var(--linea);
  background:var(--panel2);color:var(--texto);font-size:24px;font-weight:600;cursor:pointer;line-height:1}
.stepper button:active{background:var(--linea)}
.stepper .btn-n{width:50px;font-size:15px;font-weight:700;color:var(--ambar);letter-spacing:.5px}
.stepper input{width:60px;height:48px;text-align:center;border:1px solid var(--linea);border-radius:9px;
  background:var(--fondo);color:var(--texto);font-size:19px;font-weight:600;margin:0 4px;
  font-variant-numeric:tabular-nums}
.stepper input.conteo-pos{border-color:var(--ok);color:var(--ok)}
.mas{width:100%;padding:12px;border-radius:9px;border:1px dashed var(--linea);background:none;
  color:var(--apagado);font-family:inherit;font-size:14px;cursor:pointer;margin:6px 0 14px}
.vacio{color:var(--apagado);text-align:center;padding:34px 10px;font-size:14.5px}
footer{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--linea);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.resumen{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:14px;color:var(--apagado)}
.resumen b{color:var(--texto);font-variant-numeric:tabular-nums}
#estadoGuardado{font-size:12px}
#estadoGuardado.pendiente{color:var(--ambar)}
#estadoGuardado.ok{color:var(--ok)}
.acciones{display:flex;gap:10px}
#btnGuardar{flex:1;padding:16px;border-radius:10px;border:0;background:var(--rojo);color:#fff;
  font-family:"Archivo";font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer}
#btnGuardar[disabled]{opacity:.45}
#btnCopiar{padding:16px 18px;border-radius:10px;border:1px solid var(--linea);background:var(--panel2);
  color:var(--texto);font-family:inherit;font-size:14px;cursor:pointer}
@media (min-width:720px){
  header>*,main,footer>*{max-width:720px;margin-left:auto;margin-right:auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Conteo de vans <span class="rojo">· Gyaa Tattoo Supply</span></h1>
  <div class="sub">Elige la van, busca el producto y pon cuántas unidades hay dentro. Con el botón +N sumas varias de golpe (o escribe +5 en la casilla). Al final dale a Guardar.</div>
  <div class="vans" role="tablist">
    <button class="van-btn" id="tabV1" onclick="cambiarVan('v1')">Van 1<small id="resV1"></small></button>
    <button class="van-btn" id="tabV2" onclick="cambiarVan('v2')">Van 2<small id="resV2"></small></button>
  </div>
  <div class="filtros">
    <input type="search" id="buscar" placeholder="Buscar producto o código…" autocomplete="off">
    <select id="seccion"><option value="">Sección…</option></select>
  </div>
</header>

<main><div id="app"></div></main>

<footer>
  <div class="resumen">
    <span id="totales"></span>
    <span id="estadoGuardado"></span>
  </div>
  <div class="acciones">
    <button id="btnGuardar" onclick="guardar()">Guardar conteo</button>
    <button id="btnCopiar" onclick="copiarResumen()" title="Copiar resumen">Copiar</button>
  </div>
</footer>

  localStorage.setItem('gyaa-vans-ediciones',JSON.stringify(EDI));
}catch(e){}

var norm=function(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');};
CAT.forEach(function(it){it.q=norm(it.n+' '+it.v+' '+it.k);});
var secciones=[]; CAT.forEach(function(it){if(secciones.indexOf(it.s)<0)secciones.push(it.s);});
secciones.sort();
var sel=document.getElementById('seccion');
secciones.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s.replace('Tintas · ','Tintas: ');sel.appendChild(o);});

function datos(){return EST[van];}
function filtrar(){
  var q=norm(document.getElementById('buscar').value.trim());
  var sec=sel.value;
  if(!q && !sec) return null; // pantalla inicial
  return CAT.filter(function(it){
    if(sec && it.s!==sec) return false;
    if(q && it.q.indexOf(q)<0) return false;
    return true;
  });
}
function render(){
  var app=document.getElementById('app'); app.innerHTML='';
  var lista=filtrar();
  if(lista===null){
    var d=datos(), claves=Object.keys(d);
    if(claves.length){
      var t=document.createElement('div');t.className='sec-titulo';t.textContent='Ya contado en esta van';app.appendChild(t);
      CAT.forEach(function(it){ if(d[it.k]!=null) app.appendChild(fila(it)); });
    } else {
      app.innerHTML='<div class="vacio">Busca un producto arriba o elige una sección.<br>Lo que vayas contando aparecerá aquí.</div>';
    }
  } else if(!lista.length){
    app.innerHTML='<div class="vacio">Nada con ese nombre. Prueba con menos letras.</div>';
  } else {
    var grupo='';
    lista.slice(0,limite).forEach(function(it){
      if(it.s!==grupo){grupo=it.s;var t=document.createElement('div');t.className='sec-titulo';t.textContent=grupo;app.appendChild(t);}
      app.appendChild(fila(it));
    });
    if(lista.length>limite){
      var b=document.createElement('button');b.className='mas';
      b.textContent='Mostrar más ('+(lista.length-limite)+' restantes)';
      b.onclick=function(){limite+=120;render();};
      app.appendChild(b);
    }
  }
  pintarResumen();
}
function fila(it){
  var d=datos(), val=d[it.k];
  var div=document.createElement('div');div.className='fila'+(val!=null?' contada':'');
  var info=document.createElement('div');info.className='info';
  var n=document.createElement('div');n.className='nombre';n.textContent=it.n;
  var de=document.createElement('div');de.className='detalle';de.textContent=it.v+' · $'+it.p;
  info.appendChild(n);info.appendChild(de);
  var st=document.createElement('div');st.className='stepper';
  var menos=document.createElement('button');menos.textContent='−';menos.setAttribute('aria-label','Quitar uno');
  var inp=document.createElement('input');inp.type='tel';inp.inputMode='numeric';inp.placeholder='—';
  if(val!=null){inp.value=val; if(val>0)inp.className='conteo-pos';}
  var mas=document.createElement('button');mas.textContent='+';mas.setAttribute('aria-label','Sumar uno');
  var masN=document.createElement('button');masN.textContent='+N';masN.className='btn-n';masN.setAttribute('aria-label','Sumar varias');
  function poner(v){
    if(v===''||v==null){delete d[it.k]; EDI[van][it.k]='__borrar__';}
    else {v=Math.max(0,parseInt(v,10)||0); d[it.k]=v; EDI[van][it.k]=v;}
    marcarPendiente(); val=d[it.k];
    inp.value=(val!=null?val:''); inp.className=(val>0?'conteo-pos':'');
    div.className='fila'+(val!=null?' contada':''); pintarResumen();
  }
  menos.onclick=function(){poner((val||0)-1>=0?(val||0)-1:0);};
  mas.onclick=function(){poner((val||0)+1);};
  masN.onclick=function(){
    var n=prompt('¿Cuántas unidades le sumo a "'+it.n+' '+it.v+'"?');
    if(n==null) return; n=parseInt(n,10);
    if(!isNaN(n)&&n>0) poner((val||0)+n);
  };
  inp.onchange=function(){
    var t=inp.value.trim();
    if(/^\+\d+$/.test(t)){ poner((val||0)+parseInt(t.slice(1),10)); }
    else poner(t);
  };
  st.appendChild(menos);st.appendChild(inp);st.appendChild(mas);st.appendChild(masN);
  div.appendChild(info);div.appendChild(st);
  return div;
}
function resumenVan(v){
  var d=EST[v],items=0,uds=0;
  for(var k in d){items++;uds+=d[k];}
  return {items:items,uds:uds};
}
function pintarResumen(){
  var r1=resumenVan('v1'), r2=resumenVan('v2');
  document.getElementById('resV1').textContent=r1.items? r1.items+' prod · '+r1.uds+' uds':'sin contar';
  document.getElementById('resV2').textContent=r2.items? r2.items+' prod · '+r2.uds+' uds':'sin contar';
  var r=van==='v1'?r1:r2;
  document.getElementById('totales').innerHTML='En esta van: <b>'+r.items+'</b> productos · <b>'+r.uds+'</b> unidades';
  var e=document.getElementById('estadoGuardado');
  if(pendiente){e.textContent='Cambios sin guardar';e.className='pendiente';}
  else if(EST.meta.actualizado){e.textContent='Guardado '+new Date(EST.meta.actualizado).toLocaleString('es-US',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});e.className='ok';}
  else {e.textContent='';e.className='';}
  document.getElementById('btnGuardar').disabled=!pendiente;
}
function marcarPendiente(){
  pendiente=true;
  try{localStorage.setItem('gyaa-vans-ediciones',JSON.stringify(EDI));}catch(e){}
  pintarResumen();
}
function cambiarVan(v){
  van=v; limite=120;
  document.getElementById('tabV1').className='van-btn'+(v==='v1'?' activa-v1':'');
  document.getElementById('tabV2').className='van-btn'+(v==='v2'?' activa-v2':'');
  render();
}
document.getElementById('buscar').addEventListener('input',function(){limite=120;render();});
sel.addEventListener('change',function(){limite=120;render();});

function construirHTML(){
  EST.meta.actualizado=Date.now();
  document.getElementById('estado').textContent=JSON.stringify(EST);
  var app=document.getElementById('app'); var guard=app.innerHTML; app.innerHTML='';
  var html='<!doctype html>\n'+document.documentElement.outerHTML;
  app.innerHTML=guard;
  return html;
}
async function guardar(){
  var btn=document.getElementById('btnGuardar');
  btn.disabled=true; btn.textContent='Guardando…';
  try{
    if(artifactNS===null && !modoLocal){ if(window.claude && window.claude.use){ artifactNS=await claude.use('artifact'); } if(!artifactNS) modoLocal=true; }
    if(!modoLocal){
      await artifactNS.publish(construirHTML());
      pendiente=false;
      EDI={v1:{},v2:{}};
      try{localStorage.setItem('gyaa-vans-ediciones',JSON.stringify(EDI));}catch(e){}
    } else {
      marcarPendiente();
      alert('En este acceso el conteo se guarda solo en este teléfono. Cuando termines, dale a "Copiar" y manda el resumen por WhatsApp.');
    }
  }catch(err){
    if(err && (err.code==='conflict')){ /* otra vista publicó; la página se recarga sola */ }
    else if(err && (err.code==='not_granted'||err.code==='not_writer')){
      modoLocal=true;
      alert('Este enlace es de solo lectura: el conteo queda guardado en este teléfono. Al terminar, dale a "Copiar" y mándalo por WhatsApp.');
    } else { alert('No se pudo guardar. Revisa la conexión y vuelve a intentar.'); }
  }
  btn.textContent='Guardar conteo';
  pintarResumen();
}
function copiarResumen(){
  var out=[];
  ['v1','v2'].forEach(function(v){
    var d=EST[v],lineas=[];
    CAT.forEach(function(it){ if(d[it.k]!=null) lineas.push(it.n+' '+it.v+' ['+it.k+'] = '+d[it.k]); });
    if(lineas.length){ out.push((v==='v1'?'VAN 1':'VAN 2')+' ('+lineas.length+' productos)'); out=out.concat(lineas); out.push(''); }
  });
  var txt=out.length?out.join('\n'):'Sin conteos todavía.';
  if(navigator.share){ navigator.share({text:txt}).catch(function(){}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){alert('Resumen copiado.');}); }
}
cambiarVan('v1');
if(window.claude && window.claude.use){ claude.use('artifact').then(function(ns){ artifactNS=ns; if(!ns) modoLocal=true; }); } else { modoLocal=true; }
</script>
</body>
</html>
