<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inventario Van Gleyber</title>
<style>
:root{
  --fondo:#0d0d0d; --panel:#181818; --panel2:#222222; --linea:#2e2e2e;
  --tinta:#f2f2f2; --apagado:#9a9a9a; --amarillo:#F5C400; --negro:#0d0d0d;
  --verde:#3ddc84; --rojo:#ff5d5d; --naranja:#ffab40;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{background:var(--fondo);color:var(--tinta);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
     line-height:1.4;padding-bottom:120px}
header{position:sticky;top:0;z-index:10;background:var(--fondo);padding:14px 14px 10px;border-bottom:1px solid var(--linea)}
h1{font-size:1.05rem;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}
h1 span{color:var(--amarillo)}
.fecha{color:var(--apagado);font-size:.78rem;margin-top:2px}
.busca{margin-top:10px;display:flex;gap:8px}
.busca input{flex:1;background:var(--panel);border:1px solid var(--linea);border-radius:12px;
  color:var(--tinta);font-size:1rem;padding:12px 14px;outline:none}
.busca input:focus{border-color:var(--amarillo)}
.busca button{background:var(--panel);border:1px solid var(--linea);border-radius:12px;color:var(--apagado);
  font-size:1rem;padding:0 14px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;background:var(--panel);
  border:1px solid var(--linea);color:var(--apagado);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tab.act{background:var(--amarillo);color:var(--negro);border-color:var(--amarillo)}
.resumen{padding:10px 14px;color:var(--apagado);font-size:.82rem}
#lista{padding:0 10px}
.item{background:var(--panel);border:1px solid var(--linea);border-radius:14px;margin-bottom:8px;overflow:hidden}
.item.cambiado{border-color:var(--naranja)}
.cab{display:flex;align-items:center;gap:10px;padding:12px 12px;cursor:pointer}
.info{flex:1;min-width:0}
.nom{font-weight:600;font-size:.95rem}
.det{color:var(--apagado);font-size:.78rem;margin-top:1px}
.qty{min-width:46px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:1.05rem;padding:0 8px;font-variant-numeric:tabular-nums}
.qty.cero{color:var(--apagado)}
.qty.con{color:var(--amarillo)}
.qty.mod{background:var(--naranja);color:var(--negro)}
.ctrl{display:none;border-top:1px solid var(--linea);padding:12px;gap:8px;flex-wrap:wrap;align-items:center}
.item.abierto .ctrl{display:flex}
.ctrl button{border:none;border-radius:10px;font-size:1.05rem;font-weight:800;height:46px;min-width:56px;padding:0 12px}
.bmenos{background:var(--panel2);color:var(--rojo)}
.bmas{background:var(--panel2);color:var(--verde)}
.bfijar{background:var(--panel2);color:var(--tinta);font-size:.85rem}
.bquitar{background:var(--panel2);color:var(--rojo);font-size:.85rem}
.bdes{background:transparent;color:var(--apagado);font-size:.8rem;min-width:auto}
.vacio{text-align:center;color:var(--apagado);padding:40px 20px;font-size:.9rem}
.nuevoBtn{margin:4px 14px 10px;display:none;width:calc(100% - 28px);background:var(--panel);border:1px dashed var(--amarillo);
  color:var(--amarillo);border-radius:12px;padding:13px;font-size:.9rem;font-weight:700}
.pie{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--fondo) 30%);padding:14px;display:flex;gap:10px}
.pie button{flex:1;border:none;border-radius:14px;padding:15px 8px;font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.benviar{background:var(--amarillo);color:var(--negro)}
.benviar:disabled{background:var(--panel2);color:var(--apagado)}
.bcopiar{background:var(--panel);color:var(--tinta);border:1px solid var(--linea) !important;flex:0 0 30%}
.aviso{position:fixed;left:14px;right:14px;bottom:90px;background:var(--verde);color:#05300f;border-radius:12px;
  padding:12px;text-align:center;font-weight:700;display:none;z-index:20}
dialog{border:none;border-radius:16px;background:var(--panel);color:var(--tinta);padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font-size:1rem;margin-bottom:12px}
dialog input{width:100%;background:var(--panel2);border:1px solid var(--linea);border-radius:10px;color:var(--tinta);
  font-size:1.05rem;padding:12px;margin-bottom:10px;outline:none}
dialog .fila{display:flex;gap:8px}
dialog .fila button{flex:1;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:.95rem}
.bok{background:var(--amarillo);color:var(--negro)}
.bcancel{background:var(--panel2);color:var(--tinta)}
</style>
</head>
<body>
<header>
  <h1>Inventario · <span>Van Gleyber</span></h1>
  <div class="fecha" id="fecha"></div>
  <div class="busca">
    <input id="q" type="search" placeholder="Buscar producto…" autocomplete="off">
    <button id="limpiar" aria-label="Limpiar">✕</button>
  </div>
  <div class="tabs">
    <div class="tab act" id="tabVan">Mi van</div>
    <div class="tab" id="tabTodo">Toda la tienda</div>
  </div>
</header>
<div class="resumen" id="resumen"></div>
<button class="nuevoBtn" id="nuevoBtn">+ Producto nuevo (no está en la tienda)</button>
<div id="lista"></div>
<div class="pie">
  <button class="bcopiar" id="bcopiar">Copiar</button>
  <button class="benviar" id="benviar" disabled>Enviar cambios</button>
</div>
<div class="aviso" id="aviso"></div>

<dialog id="dlgFijar">
  <h2 id="dlgFijarTit">Cantidad</h2>
  <input id="dlgFijarNum" type="number" inputmode="numeric" min="0" placeholder="Cantidad exacta">
  <div class="fila"><button class="bcancel" id="dlgFijarNo">Cancelar</button><button class="bok" id="dlgFijarSi">Guardar</button></div>
</dialog>

<dialog id="dlgNuevo">
  <h2>Producto nuevo</h2>
  <input id="dlgNuevoNom" type="text" placeholder="Nombre (marca + color + tamaño)">
  <input id="dlgNuevoNum" type="number" inputmode="numeric" min="1" placeholder="Cantidad en la van">
  <div class="fila"><button class="bcancel" id="dlgNuevoNo">Cancelar</button><button class="bok" id="dlgNuevoSi">Añadir</button></div>
</dialog>

  if (!(k in BASE)) { delete EDI[k]; return; }

}
function qtyDe(it){ var k = clave(it); return (k in EDI) ? EDI[k] : it.q; }

  var f = norm(filtro);

function abrirFijar(it){
  itFijar = it;
  document.getElementById('dlgFijarTit').textContent = it.n + (it.v ? ' — ' + it.v : '');
  var inp = document.getElementById('dlgFijarNum');
  inp.value = qtyDe(it);
  document.getElementById('dlgFijar').showModal();
  setTimeout(function(){ inp.select(); }, 50);
}
document.getElementById('dlgFijarNo').onclick = function(){ document.getElementById('dlgFijar').close(); };
document.getElementById('dlgFijarSi').onclick = function(){
  var n = parseInt(document.getElementById('dlgFijarNum').value, 10);
  if (!isNaN(n) && n >= 0 && itFijar) poner(itFijar, n);
  document.getElementById('dlgFijar').close();
};

// producto nuevo
document.getElementById('nuevoBtn').onclick = function(){
  document.getElementById('dlgNuevoNom').value = filtro || '';
  document.getElementById('dlgNuevoNum').value = '';
  document.getElementById('dlgNuevo').showModal();
};
document.getElementById('dlgNuevoNo').onclick = function(){ document.getElementById('dlgNuevo').close(); };
document.getElementById('dlgNuevoSi').onclick = function(){
  var nom = document.getElementById('dlgNuevoNom').value.trim();
  var n = parseInt(document.getElementById('dlgNuevoNum').value, 10);
  if (nom && !isNaN(n) && n > 0){
    NUEVOS.push({ nombre: nom, cantidad: n });
    guardar(); pintar();
    avisar('Añadido a la lista de nuevos');
  }
  document.getElementById('dlgNuevo').close();
};

// tabs + busqueda
var q = document.getElementById('q');
q.addEventListener('input', function(){ filtro = q.value.trim(); abierto = null; pintar(); });
document.getElementById('limpiar').onclick = function(){ q.value=''; filtro=''; pintar(); };
document.getElementById('tabVan').onclick = function(){ setModo('van'); };
document.getElementById('tabTodo').onclick = function(){ setModo('todo'); };
function setModo(m){
  modo = m; abierto = null;
  document.getElementById('tabVan').classList.toggle('act', m==='van');
  document.getElementById('tabTodo').classList.toggle('act', m==='todo');
  pintar();
}

// ---- export ----
function textoCambios(){
  var lineas = ['INVENTARIO VAN GLEYBER — cambios'];
  var d = new Date();
  lineas[0] += ' ' + d.getDate() + '/' + (d.getMonth()+1) + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
  Object.keys(EDI).forEach(function(k){
    var it = CAT.find(function(x){ return clave(x) === k; });
    if (!it) return;
    lineas.push(it.n + (it.v ? ' ' + it.v : '') + ' [' + (it.s || 'SIN-SKU') + '] = ' + EDI[k]);
  });
  NUEVOS.forEach(function(nv){
    lineas.push('NUEVO: ' + nv.nombre + ' = ' + nv.cantidad);
  });
  return lineas.join('\n');
}
function pintarPie(){
  var n = nCambios();
  var b = document.getElementById('benviar');
  b.disabled = !n;
  b.textContent = n ? 'Enviar ' + n + ' cambio(s)' : 'Enviar cambios';
}
document.getElementById('benviar').onclick = function(){
  if (!nCambios()) return;
  var t = textoCambios();
  if (navigator.share){
    navigator.share({ text: t }).then(function(){ avisar('Enviado. Cuando lo carguen te avisan.'); }).catch(function(){});
  } else {
    copiar(t);
  }
};
document.getElementById('bcopiar').onclick = function(){ copiar(textoCambios()); };
function copiar(t){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ avisar('Copiado — pégalo en WhatsApp'); });
  } else {
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    avisar('Copiado — pégalo en WhatsApp');
  }
}
function avisar(msg){
  var a = document.getElementById('aviso');
  a.textContent = msg; a.style.display = 'block';
  clearTimeout(a._t); a._t = setTimeout(function(){ a.style.display = 'none'; }, 2500);
}

pintar(); pintarPie();
</script>
